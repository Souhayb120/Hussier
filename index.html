<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Mofawid — gestion des études d'huissier de justice (المفوّض القضائي)"
    />
    <title>Mofawid — Études d'huissier de justice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applique la langue choisie avant le premier rendu (évite le clignotement).
      try {
        var lang = localStorage.getItem('mofawid.lang')
        var dir = lang === 'ar' ? 'rtl' : 'ltr'
        document.documentElement.lang = lang === 'ar' ? 'ar' : 'fr'
        document.documentElement.dir = dir
      } catch (e) {
        /* noop */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
